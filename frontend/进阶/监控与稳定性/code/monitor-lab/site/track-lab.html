<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>埋点实验页</title>
<style>
  body { font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; margin: 0; color: #1f2328; }
  .pad { padding: 20px 24px; }
  button { font: inherit; padding: 8px 16px; }
  .card { padding: 16px; margin: 12px 0; background: #f3f4f6; border-radius: 6px; }
  .spacer { height: 1400px; background: repeating-linear-gradient(180deg, #fff, #fff 40px, #fafafa 40px, #fafafa 80px); }
</style>
</head>
<body>
<div class="pad">
  <h1>埋点实验页</h1>
  <p>页面里只写 <code>data-expose</code> / <code>data-track</code> 两个属性，采集逻辑全在 SDK 里。</p>
  <button data-track="cta-hero" data-expose="hero-cta">开始体验</button>
  <div class="card" data-expose="card-intro">首屏可见的卡片（进视口即曝光）</div>
  <div class="card"><button data-track="cta-card">卡片内的按钮</button></div>
</div>
<div class="spacer"></div>
<div class="pad">
  <div class="card" data-expose="footer-banner">底部横幅（需要滚动到才会曝光）</div>
</div>

<script type="module">
import { init } from '/sdk/index.mjs'

const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
const sm = init({ appId: 'track-lab', url: '/collect' })

async function run() {
  // 1. 页面浏览：PV 挂在会话上，UV 靠匿名 ID 去重
  sm.track.pageView({ ref: 'direct' })

  // 2. 曝光：注册那些带 data-expose 的元素（首屏可见的会立刻触发）
  const watched = sm.track.observeExposure()

  // 3. 点击：事件委托，新增的 DOM 不用重新绑监听
  sm.track.listenClicks()

  await sleep(300)

  // 4. 模拟用户点击两个按钮
  document.querySelector('[data-track="cta-hero"]').click()
  document.querySelector('[data-track="cta-card"]').click()

  // 5. 自定义事件：埋点字典之外的一次性事件
  sm.track.track('search', { keyword: '性能优化' })

  // 6. 滚动到底，让底部横幅进入视口 → 触发它的曝光
  await sleep(200)
  window.scrollTo(0, document.body.scrollHeight)
  await sleep(500)

  // 7. 收口：结算停留时长并把整批事件发出去
  await sm.flushAll('test')
  await fetch('/collect', { method: 'POST', body: JSON.stringify({ events: [{ kind: 'lab-done', ts: Date.now(), watched }] }) })
}

run()
</script>
</body>
</html>
