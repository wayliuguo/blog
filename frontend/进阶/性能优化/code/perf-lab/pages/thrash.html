<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <title>布局抖动对照页</title>
        <link rel="icon" href="data:," />
        <script src="./lab.js"></script>
        <style>
            body {
                margin: 0;
                font:
                    16px/1.6 system-ui,
                    'Microsoft YaHei',
                    sans-serif;
            }
            header {
                padding: 16px 24px;
                background: #eef2ff;
            }
            header h1 {
                margin: 0;
                font-size: 22px;
            }
            #boxes {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                padding: 12px;
            }
            .box {
                height: 18px;
                background: #cfe0ff;
                font: 10px/18px monospace;
                text-align: center;
                overflow: hidden;
            }
        </style>
    </head>
    <body>
        <header><h1>2000 个盒子的宽度，交错读写 vs 集中读写</h1></header>
        <div id="boxes"></div>
        <script>
            const mode = new URLSearchParams(location.search).get('mode') || 'interleaved'
            const COUNT = 2000
            const wrap = document.getElementById('boxes')
            const boxes = []

            for (let i = 0; i < COUNT; i++) {
                const el = document.createElement('div')
                el.className = 'box'
                el.textContent = i
                el.style.width = '30px'
                wrap.appendChild(el)
                boxes.push(el)
            }
            void wrap.offsetHeight // 先把已有布局刷干净，两个版本的起点一致

            let layouts = 0
            const loop = Lab.time(() => {
                if (mode === 'interleaved') {
                    for (let i = 0; i < COUNT; i++) {
                        boxes[i].style.width = 30 + (i % 20) + 'px' // 写样式
                        layouts += boxes[i].offsetWidth > 0 ? 1 : 0 // 紧接着读 → 浏览器必须立刻重算布局
                    }
                } else {
                    const widths = boxes.map(el => el.offsetWidth) // 集中读：只触发一次布局
                    for (let i = 0; i < COUNT; i++) boxes[i].style.width = widths[i] + 2 + 'px' // 集中写：留到下一帧统一布局
                    layouts = 1
                }
            })

            Lab.finish({ mode, count: COUNT, loopMs: loop.ms, layouts }, 50)
        </script>
    </body>
</html>
