<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>路由级代码分割：全量引入 vs 按需动态引入</title>
<link rel="icon" href="data:,">
<script src="./lab.js"></script>
<style>
    body { margin: 0; font: 16px/1.6 system-ui, "Microsoft YaHei", sans-serif; }
    header { padding: 16px 24px; background: #eef2ff; }
    header h1 { margin: 0; font-size: 22px; }
    #nav { padding: 8px 24px; }
    #nav button { padding: 6px 14px; margin-right: 8px; cursor: pointer; }
    #view { padding: 12px 24px; min-height: 120px; }
</style>
</head>
<body>
<header><h1>三个路由，每个 120KB：首屏就全下，还是切到哪下哪</h1></header>
<div id="nav"><button data-route="1">去路由 1</button><button data-route="2">去路由 2</button><button data-route="3">去路由 3</button></div>
<div id="view">…</div>
<script type="module">
    const mode = new URLSearchParams(location.search).get('mode') || 'eager'
    const view = document.getElementById('view')
    const started = performance.now()
    const KBPS = 1500 // 实验台把这个值当带宽，按 1.5 Mbps 分片慢发，否则本机「秒下」看不出差别

    async function eager() {
        // 全量引入：首屏就把整包拉下来（用 /bundle 端点模拟三个路由合成一个 chunk）
        await import(`/bundle?n=3&kbEach=120&kbps=${KBPS}&name=app`)
        const firstScreen = Math.round(performance.now() - started)
        // 之后依次访问三个路由：eager 版本不再产生任何新的网络请求
        for (const route of ['1', '2', '3']) view.textContent = '路由 ' + route + ' 就绪（首屏已全量加载）'
        return firstScreen
    }

    async function lazy() {
        // 按需引入：首屏只加载当前路由，切到哪个才 import 哪个
        const loaded = new Set()
        async function goto(route) {
            if (!loaded.has(route)) {
                await import(`/feature?i=${route}&kbEach=120&kbps=${KBPS}`)
                loaded.add(route)
            }
            view.textContent = '路由 ' + route + ' 就绪（已加载 ' + loaded.size + ' 个 chunk）'
        }
        await goto('1')
        const firstScreen = Math.round(performance.now() - started)
        await goto('2')
        await goto('3')
        return firstScreen
    }

    const loadMs = await (mode === 'eager' ? eager() : lazy())
    const chunks = performance.getEntriesByType('resource').filter((e) => e.name.includes('/bundle') || e.name.includes('/feature')).length
    Lab.finish({ mode, routes: 3, chunkSizeKb: 120, kbps: KBPS, chunks, loadMs }, 200)
</script>
</body>
</html>
