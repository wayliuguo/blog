<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>长列表：全量渲染 vs 虚拟滚动</title>
<link rel="icon" href="data:,">
<script src="./lab.js"></script>
<style>
    body { margin: 0; font: 16px/1.6 system-ui, "Microsoft YaHei", sans-serif; }
    header { padding: 12px 24px; background: #eef2ff; }
    header h1 { margin: 0; font-size: 20px; }
    #viewport { height: 480px; overflow: auto; border-top: 1px solid #ddd; position: relative; }
    .row { height: 32px; line-height: 32px; padding: 0 12px; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
    .spacer { position: relative; }
    .win { position: absolute; left: 0; right: 0; }
</style>
</head>
<body>
<header><h1>10000 行长列表：DOM 里到底该有多少个节点</h1></header>
<div id="viewport"></div>
<script>
    const mode = new URLSearchParams(location.search).get('mode') || 'full'
    const TOTAL = 10000
    const ROW_H = 32
    const viewport = document.getElementById('viewport')

    const rowHtml = (i) => `<div class="row">第 ${i + 1} 行数据</div>`

    let scrollUpdates = 0
    let scrollMs = 0

    if (mode === 'full') {
        const work = Lab.time(() => {
            let html = ''
            for (let i = 0; i < TOTAL; i++) html += rowHtml(i)
            viewport.innerHTML = html
        })
        // 同样的滚动动作：全量版本 DOM 里已经有 10000 行，滚动不需要重算窗口
        const jump = Lab.time(() => {
            viewport.scrollTop = 5000 * ROW_H
            void viewport.scrollTop
        })
        Lab.finish(
            {
                mode,
                total: TOTAL,
                domNodes: document.getElementsByTagName('*').length,
                buildMs: work.ms,
                rendered: TOTAL,
                windowSize: TOTAL,
                scrollMs: jump.ms,
                scrollUpdates: 0,
                heapUsed: performance.memory ? performance.memory.usedJSHeapSize : null
            },
            300
        )
    } else {
        // 虚拟滚动：只渲染可视窗口 + 上下各 5 行的缓冲，其余用一根撑高的占位条代替
        const BUFFER = 5
        const WINDOW = Math.ceil(viewport.clientHeight / ROW_H)
        viewport.innerHTML = '<div class="spacer"><div class="win" id="win"></div></div>'
        const win = document.getElementById('win')

        function renderWindow() {
            const start = Math.max(0, Math.floor(viewport.scrollTop / ROW_H) - BUFFER)
            const end = Math.min(TOTAL, start + WINDOW + BUFFER * 2)
            let html = ''
            for (let i = start; i < end; i++) html += rowHtml(i)
            win.innerHTML = html
            win.style.top = start * ROW_H + 'px'
            scrollUpdates++
            return end - start
        }

        const work = Lab.time(() => {
            viewport.firstElementChild.style.height = TOTAL * ROW_H + 'px'
            renderWindow()
        })

        // 模拟用户一次大跨度滚动：虚拟滚动要重算窗口，全量渲染不需要
        const jump = Lab.time(() => {
            viewport.scrollTop = 5000 * ROW_H
            scrollMs = renderWindow()
        })

        Lab.finish(
            {
                mode,
                total: TOTAL,
                domNodes: document.getElementsByTagName('*').length,
                buildMs: work.ms,
                rendered: document.getElementById('win').children.length,
                windowSize: WINDOW,
                scrollMs: jump.ms,
                scrollUpdates,
                heapUsed: performance.memory ? performance.memory.usedJSHeapSize : null
            },
            300
        )
    }
</script>
</body>
</html>
