<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>阻塞脚本：head 里同步加载</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/slow?ms=60&kb=8&name=site.css">
<!-- 反面写法：解析到这里必须停下来，等脚本下载（200ms）并执行完才继续 -->
<script src="/slow?ms=200&kb=80&name=block.js"></script>
<script src="./lab.js"></script>
<style>
    body { margin: 0; font: 16px/1.6 system-ui, "Microsoft YaHei", sans-serif; }
    .hero { padding: 40px 24px; background: #4f7cff; color: #fff; }
    .row { padding: 10px 24px; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
<div class="hero">
    <h1>首屏标题（这段内容要等 head 里的脚本回来才能画）</h1>
</div>
<div id="list"></div>
<script>
    let html = ''
    for (let i = 0; i < 20; i++) html += `<div class="row">第 ${i + 1} 行</div>`
    document.getElementById('list').innerHTML = html
    Lab.finish({ mode: 'head-sync' })
</script>
</body>
</html>
