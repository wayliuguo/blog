<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>订单工作台</title>
    <link rel="stylesheet" href="./app.css" />
</head>
<body>
    <header>
        <h1>订单工作台 <small id="env-tag">desktop</small></h1>
        <p id="bridge-hint">桥接状态检测中…</p>
    </header>
    <main>
        <section id="list-panel">
            <h2>订单列表</h2>
            <ul id="order-list"></ul>
        </section>
        <section id="detail-panel">
            <h2>详情</h2>
            <div id="detail-empty">点击左侧订单查看详情</div>
            <div id="detail-body" hidden>
                <p id="d-title"></p>
                <p id="d-meta"></p>
                <p id="d-status"></p>
                <button id="advance-btn">推进到下一状态</button>
            </div>
        </section>
    </main>
    <script src="./app.js"></script>
</body>
</html>
