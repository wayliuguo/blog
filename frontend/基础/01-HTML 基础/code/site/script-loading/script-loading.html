<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>脚本加载：默认 / defer / async</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                max-width: 640px;
                margin: 2rem auto;
                padding: 0 1rem;
                line-height: 1.6;
            }
            h1 {
                font-size: 1.4rem;
            }
            code {
                background: #f1f5f9;
                padding: 0 4px;
                border-radius: 4px;
            }
            ol#log {
                background: #0f172a;
                color: #e2e8f0;
                padding: 1rem 1rem 1rem 2.2rem;
                border-radius: 8px;
                font-family: ui-monospace, monospace;
                font-size: 0.9rem;
            }
            ol#log li {
                margin: 2px 0;
            }
        </style>
        <script>
            // 日志面板：记录所有日志并按时间戳排序渲染。
            // sync 脚本执行时 body 还没解析，无法直接写入面板，因此统一走 __logItems 缓冲，
            // 面板出现后 render() 重建列表，保证顺序严格按执行时间
            window.__logItems = []
            window.__log = msg => {
                window.__logItems.push({ t: performance.now(), msg })
                const box = document.getElementById('log')
                if (box) render()
            }
            function render() {
                const box = document.getElementById('log')
                box.replaceChildren(
                    ...[...window.__logItems]
                        .sort((a, b) => a.t - b.t)
                        .map(({ t, msg }) => {
                            const li = document.createElement('li')
                            li.textContent = t.toFixed(1).padStart(7) + 'ms  ' + msg
                            return li
                        })
                )
            }
            document.addEventListener('DOMContentLoaded', () => window.__log('DOMContentLoaded 触发'))
            window.addEventListener('load', () => window.__log('load 触发'))
        </script>
        <!-- 三种加载方式：默认（同步）阻塞解析最先执行；defer 等解析完成、DOMContentLoaded 前按序执行；async 下载完立即执行 -->
        <script src="log.js?name=sync"></script>
        <script defer src="log.js?name=defer"></script>
        <script async src="log.js?name=async&delay=800"></script>
    </head>
    <body>
        <h1>脚本加载三种方式：默认 / <code>defer</code> / <code>async</code></h1>
        <p>本页用三种方式加载同一份 <code>log.js</code>，刷新页面观察下方日志：</p>
        <ul>
            <li><strong>默认（同步）</strong>：阻塞解析，最先执行。</li>
            <li>
                <code>defer</code>：下载与解析并行，等文档解析完成、<code>DOMContentLoaded</code> 之前按文档顺序执行。
            </li>
            <li>
                <code>async</code>：下载完立即执行、不保序；本例加了
                <code>?delay=800</code> 模拟慢下载，因此最后才执行，甚至晚于 <code>DOMContentLoaded</code>。
            </li>
        </ul>
        <ol id="log">
            <li>刷新后此处按时间出现执行记录…</li>
        </ol>
    </body>
</html>
