<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>脚本加载 · 首屏白屏</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                max-width: 860px;
                margin: 2rem auto;
                padding: 0 1rem;
                line-height: 1.6;
            }
            h1 {
                font-size: 1.4rem;
            }
            code {
                background: #f1f5f9;
                padding: 0 4px;
                border-radius: 4px;
            }
            .row {
                display: flex;
                gap: 1rem;
            }
            .frame {
                flex: 1;
                border: 1px solid #cbd5e1;
                border-radius: 8px;
                overflow: hidden;
            }
            .frame h2 {
                font-size: 0.9rem;
                margin: 0;
                padding: 0.5rem;
                background: #f8fafc;
                border-bottom: 1px solid #e2e8f0;
            }
            iframe {
                width: 100%;
                height: 220px;
                border: 0;
            }
            button {
                font-size: 1rem;
                padding: 0.5rem 1rem;
                cursor: pointer;
                margin: 1rem 0;
            }
        </style>
    </head>
    <body>
        <h1>首屏白屏：<code>head</code> 同步脚本 vs <code>defer</code> vs <code>async</code></h1>
        <p>
            三个 iframe 加载同一份「慢脚本 + 可见内容」，唯一区别是脚本属性。首次加载或点「重新加载」后观察：<code
                >head</code
            >
            里的同步脚本让内容约 2 秒后才出现（白屏），<code>defer</code> 与 <code>async</code> 版立即渲染。
        </p>
        <button id="reload">重新加载三个 iframe</button>
        <div class="row">
            <div class="frame">
                <h2>① head 同步 <code>script</code>（白屏约 2s）</h2>
                <iframe id="f-sync" src="first-screen-sync.html"></iframe>
            </div>
            <div class="frame">
                <h2>② <code>defer</code>（立即渲染）</h2>
                <iframe id="f-defer" src="first-screen-defer.html"></iframe>
            </div>
            <div class="frame">
                <h2>③ <code>async</code>（立即渲染）</h2>
                <iframe id="f-async" src="first-screen-async.html"></iframe>
            </div>
        </div>
        <script>
            document.getElementById('reload').addEventListener('click', () => {
                // 带时间戳重新导航，绕过浏览器对 iframe 文档本身的缓存
                const t = Date.now()
                document.getElementById('f-sync').src = 'first-screen-sync.html?t=' + t
                document.getElementById('f-defer').src = 'first-screen-defer.html?t=' + t
                document.getElementById('f-async').src = 'first-screen-async.html?t=' + t
            })
        </script>
    </body>
</html>
