<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>脚本加载 · 执行顺序验证</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                max-width: 640px;
                margin: 2rem auto;
                padding: 0 1rem;
                line-height: 1.6;
            }
            h1 {
                font-size: 1.4rem;
            }
            code {
                background: #f1f5f9;
                padding: 0 4px;
                border-radius: 4px;
            }
            ol#log {
                background: #0f172a;
                color: #e2e8f0;
                padding: 1rem 1rem 1rem 2.2rem;
                border-radius: 8px;
                font-family: ui-monospace, monospace;
                font-size: 0.9rem;
            }
            ol#log li {
                margin: 2px 0;
            }
        </style>
        <script>
            // 日志面板：head 里先定义，async 脚本可能比 body 早执行，用缓冲兜底
            window.__logBuffer = []
            window.__log = msg => {
                const li = document.createElement('li')
                li.textContent = performance.now().toFixed(1).padStart(7) + 'ms  ' + msg
                const box = document.getElementById('log')
                if (box) box.appendChild(li)
                else window.__logBuffer.push(li)
            }
            document.addEventListener('DOMContentLoaded', () => {
                const box = document.getElementById('log')
                ;[...window.__logBuffer].forEach(li => box.appendChild(li))
                window.__logBuffer = []
                window.__log('DOMContentLoaded 触发')
            })
            window.addEventListener('load', () => window.__log('load 触发'))
        </script>
        <script defer src="order-a.js"></script>
        <script defer src="order-b.js"></script>
        <script async src="order-c.js?delay=800"></script>
        <script async src="order-d.js"></script>
    </head>
    <body>
        <h1>执行顺序：<code>defer</code> vs <code>async</code></h1>
        <p>
            本页加载 4 个脚本：<code>defer</code> 的 a、b，<code>async</code> 的 c（下载延迟
            800ms）、d。刷新页面，观察下方日志：
        </p>
        <ul>
            <li><code>defer-a → defer-b</code> 严格按文档顺序，且都在 <code>DOMContentLoaded</code> 之前。</li>
            <li>
                <code>async-d</code> 下载完立刻执行（可能插在解析中途）；<code>async-c</code> 因延迟 800ms
                最后才执行——<code>async</code> 之间不保序。
            </li>
        </ul>
        <ol id="log">
            <li>刷新后此处按时间出现执行记录…</li>
        </ol>
    </body>
</html>
