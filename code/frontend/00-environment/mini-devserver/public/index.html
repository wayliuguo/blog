<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>最小 DevServer 示例</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                max-width: 640px;
                margin: 3rem auto;
                padding: 0 1rem;
            }
            #tip {
                color: #1f7a1f;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <h1>最小 DevServer 已启动</h1>
        <p>现在改写本文件 `.title` 或新增一个文件保存，页面会<strong id="tip">自动刷新</strong>。</p>
        <p>原理：服务端监听 public 目录 → 通过 SSE 推送 reload 事件 → 页面收到即刷新。</p>

        <script>
            // 订阅服务端广播的"文件变化"事件，收到即刷新
            const es = new EventSource('/__reload')
            es.onmessage = () => {
                document.getElementById('tip').textContent = '检测到文件变化，正在自动刷新…'
                location.reload()
            }
        </script>
    </body>
</html>
