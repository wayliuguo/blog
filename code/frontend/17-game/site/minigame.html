<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>minigame · 接住下落的物品</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                margin: 20px auto;
                max-width: 760px;
                padding: 0 16px;
                color: #1f2937;
            }
            canvas {
                background: #0f172a;
                border-radius: 8px;
                display: block;
                margin-top: 8px;
                border-bottom: 2px solid #334155;
                cursor: pointer;
            }
            p {
                font-size: 14px;
                line-height: 1.7;
            }
            code {
                background: #f3f4f6;
                padding: 2px 5px;
                border-radius: 4px;
            }
            .bar {
                height: 6px;
                background: #f43f5e;
                border-radius: 3px;
                margin-top: 8px;
            }
        </style>
    </head>
    <body>
        <h1>接住下落的物品（可玩小游戏）</h1>
        <p>
            用 <code>←</code>/<code>→</code> 或鼠标移动接住下落的物品：命中加分，漏接扣一条命，三条命耗尽即 Game Over，
            按 <code>空格</code> 或点击画面重开。它演示了本章的核心原理——<strong>AABB 矩形相交碰撞检测</strong>
            、计分与 Game Over / 重开流程，全程手写、零依赖。
        </p>
        <canvas id="game" width="720" height="420"></canvas>
        <div class="bar" id="livesBar"></div>
        <div id="info">得分 0 · 生命 3</div>
        <script>
            const canvas = document.getElementById('game')
            const ctx = canvas.getContext('2d')
            const W = canvas.width,
                H = canvas.height

            // 玩家
            const paddle = { x: W / 2 - 50, y: H - 30, w: 100, h: 18, speed: 420 }
            // 物品与三行分数
            const items = []
            let score = 0,
                lives = 3,
                over = false
            let spawnTimer = 0
            const ITEM = 26 // 物品边长
            const KEYS = {}

            window.addEventListener('keydown', e => {
                KEYS[e.key.toLowerCase()] = true
                if (e.key === ' ' && over) restart()
            })
            window.addEventListener('keyup', e => (KEYS[e.key.toLowerCase()] = false))
            window.addEventListener('mousemove', e => {
                const rect = canvas.getBoundingClientRect()
                paddle.x = e.clientX - rect.left - paddle.w / 2
            })
            canvas.addEventListener('click', () => {
                if (over) restart()
            })

            function restart() {
                items.length = 0
                score = 0
                lives = 3
                over = false
            }

            // AABB 检测：两个矩形是否相交
            function rectsHit(a, b) {
                return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y
            }

            function spawn() {
                const c = Math.random() * 100
                const color = c < 60 ? '#f59e0b' : c < 85 ? '#a78bfa' : '#f43f5e'
                const pts = color === '#f59e0b' ? 1 : color === '#a78bfa' ? 2 : -1 // 红色会扣分
                items.push({ x: Math.random() * (W - ITEM), y: -ITEM, w: ITEM, h: ITEM, vy: 200, color, pts })
            }

            function update(dt) {
                if (over) return
                const sec = dt / 1000

                // 键盘移动玩家
                if (KEYS['arrowleft'] || KEYS['a']) paddle.x -= paddle.speed * sec
                if (KEYS['arrowright'] || KEYS['d']) paddle.x += paddle.speed * sec
                paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x))

                // 生成与下落
                spawnTimer -= dt
                if (spawnTimer <= 0 && !over) {
                    spawn()
                    spawnTimer = 700
                }
                for (let i = items.length - 1; i >= 0; i--) {
                    const it = items[i]
                    it.y += it.vy * sec
                    // 与玩家碰撞 -> 命中加分
                    if (rectsHit(it, paddle)) {
                        if (it.pts > 0) score += it.pts
                        else lives--
                        items.splice(i, 1)
                        continue
                    }
                    // 落到地面 -> 漏接
                    if (it.y > H - it.h) {
                        if (it.pts > 0) lives-- // 好物没接住扣命
                        items.splice(i, 1)
                        continue
                    }
                }
                if (lives <= 0) {
                    lives = 0
                    over = true
                }
            }

            function render() {
                ctx.clearRect(0, 0, W, H)
                ctx.fillStyle = '#64748b'
                ctx.fillRect(0, H - 2, W, 2)
                for (const it of items) {
                    ctx.fillStyle = it.color
                    ctx.fillRect(it.x, it.y, it.w, it.h)
                }
                ctx.fillStyle = '#38bdf8'
                ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h)
                ctx.fillStyle = '#e2e8f0'
                ctx.font = '20px system-ui'
                ctx.fillText('得分 ' + score + '，生命 ' + lives, 14, 28)
                if (over) {
                    ctx.fillStyle = 'rgba(0,0,0,0.55)'
                    ctx.fillRect(0, 0, W, H)
                    ctx.fillStyle = '#fff'
                    ctx.font = '32px system-ui'
                    ctx.textAlign = 'center'
                    ctx.fillText('Game Over · 最终得分 ' + score, W / 2, H / 2)
                    ctx.font = '18px system-ui'
                    ctx.fillText('按 空格 或 点击 画面重新开始', W / 2, H / 2 + 40)
                    ctx.textAlign = 'left'
                }
                // 生命条
                document.getElementById('livesBar').style.width = (lives / 3) * 100 + '%'
                document.getElementById('info').textContent =
                    '得分 ' + score + ' · 生命 ' + lives + (over ? '（已结束，按空格重开）' : '')
            }

            let last = performance.now()
            function loop(now) {
                const dt = Math.min(now - last, 100)
                last = now
                update(dt)
                render()
                requestAnimationFrame(loop)
            }
            requestAnimationFrame(loop)
        </script>
    </body>
</html>
